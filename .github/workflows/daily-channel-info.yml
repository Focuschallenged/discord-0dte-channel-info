name: Daily 0DTE Channel Info

on:
  schedule:
    - cron: '0 12 * * 1-5'   # 7:00 AM EST (Nov–Mar)
    - cron: '0 11 * * 1-5'   # 7:00 AM EDT (Mar–Nov)
  workflow_dispatch:   # lets you trigger manually from the Actions tab

jobs:
  send-message:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send channel-info message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python send_channel_info.py
